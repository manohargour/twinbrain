<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twin Brain — Organisational Change Intelligence</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --subtle: #64748b;
      --line: #e2e8f0;
      --line-dark: #cbd5e1;
      --paper: #f8fafc;
      --white: #ffffff;
      --green: #059669;
      --green-dark: #047857;
      --pale: #ecfdf5;
      --pale-border: #a7f3d0;
      --amber: #b45309;
      --amberbg: #fffbeb;
      --amber-border: #fde68a;
      --red: #b91c1c;
      --redbg: #fef2f2;
      --red-border: #fecaca;
      --blue: #1d4ed8;
      --bluebg: #eff6ff;
      --blue-border: #bfdbfe;
      --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.6 var(--font-main);
      -webkit-font-smoothing: antialiased;
    }

    /* Base Typography & Elements */
    h1, h2, h3, h4, p { margin: 0 0 10px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.25; }
    h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; }
    h3 { font-size: 16px; font-weight: 600; }
    h4 { font-size: 14px; font-weight: 600; }
    a { color: var(--green); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Layout Shell */
    .tb-shell { max-width: 1400px; margin: 0 auto; padding: 24px 32px 60px; }

    /* Header */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
      padding: 20px 32px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .tb-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .tb-brand { display: flex; align-items: center; gap: 12px; }
    .tb-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 2px 4px rgba(5, 150, 105, 0.25);
    }
    .tb-title-group h1 { margin: 0; font-size: 22px; color: var(--ink); }
    .tb-thesis { color: var(--muted); font-size: 13px; font-weight: 500; }
    .tb-thesis strong { color: var(--green); }

    /* Navigation */
    nav { display: flex; gap: 4px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
    nav button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    nav button:hover { background: var(--paper); color: var(--ink); }
    nav button.active { background: var(--ink); color: var(--white); }

    /* Common Buttons & Inputs */
    .tb-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--line-dark);
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tb-btn:hover { background: var(--paper); border-color: var(--subtle); }
    .tb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tb-btn-primary {
      background: var(--green);
      color: var(--white);
      border-color: var(--green-dark);
      box-shadow: var(--shadow-sm);
    }
    .tb-btn-primary:hover:not(:disabled) { background: var(--green-dark); border-color: var(--green-dark); }
    .tb-btn-amber {
      background: var(--amber);
      color: var(--white);
      border-color: #92400e;
    }
    .tb-btn-amber:hover { background: #92400e; }
    .tb-btn-lg { padding: 10px 20px; font-size: 14px; }
    .tb-btn-sm { padding: 5px 10px; font-size: 12px; }

    /* Badges & Pills */
    .tb-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      background: #edf2f7;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .tb-badge-must { background: var(--redbg); color: var(--red); border-color: var(--red-border); }
    .tb-badge-review { background: var(--amberbg); color: var(--amber); border-color: var(--amber-border); }
    .tb-badge-no { background: var(--pale); color: var(--green); border-color: var(--pale-border); }
    .tb-badge-subtle { background: #f1f5f9; color: var(--subtle); border-color: #e2e8f0; }

    .tb-pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tb-pill-green { background: var(--pale); color: var(--green); border: 1px solid var(--pale-border); }
    .tb-pill-amber { background: var(--amberbg); color: var(--amber); border: 1px solid var(--amber-border); }
    .tb-pill-subtle { background: #f1f5f9; color: var(--subtle); }

    /* Panels & Cards */
    .tb-panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .tb-eyebrow {
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--green);
      margin-bottom: 4px;
      font-weight: 700;
    }
    .tb-panel-title { font-size: 18px; margin-bottom: 6px; }
    .tb-muted { color: var(--muted); font-size: 13px; }

    /* Flex Utilities */
    .tb-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tb-row.spread { justify-content: space-between; }
    .tb-grid { display: grid; gap: 16px; }
    .tb-grid-2 { grid-template-columns: 1fr 1fr; }
    .tb-grid-3 { grid-template-columns: repeat(3, 1fr); }

    /* Step 0 GTM Motion Styles */
    .tb-motion-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .tb-motion-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: white;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .tb-motion-card:hover {
      border-color: var(--green);
      background: var(--pale);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .tb-motion-card.active {
      border-color: var(--green);
      border-width: 2px;
      background: #eef6f2;
      box-shadow: 0 0 0 1px var(--green);
    }
    .tb-align-step {
      transition: all 0.15s ease;
    }
    .tb-align-step:hover {
      border-color: var(--green) !important;
      background: #f4faf6 !important;
      transform: translateY(-1px);
    }

    /* Hero NLP Section */
    .tb-hero {
      border: 1px solid #c7d2fe;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .tb-hero-title { font-size: 22px; margin-bottom: 6px; }
    .tb-textarea {
      width: 100%;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--white);
      resize: vertical;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .tb-textarea:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }
    .tb-chips-label { font-size: 12px; font-weight: 600; color: var(--subtle); margin: 12px 0 6px; }
    .tb-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .tb-chip {
      background: var(--white);
      border: 1px solid var(--line-dark);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .tb-chip:hover {
      background: var(--pale);
      border-color: var(--green);
      color: var(--green-dark);
    }
    .tb-hero-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* Ambiguity Alert */
    .tb-alert {
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      box-shadow: var(--shadow-sm);
    }
    .tb-alert-amber { background: var(--amberbg); border: 1.5px solid var(--amber-border); color: #78350f; }
    .tb-alert-icon { font-size: 22px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
    .tb-alert-content h4 { margin: 0 0 6px; font-size: 15px; color: #78350f; }
    .tb-definition-quote {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--amber-border);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0;
    }

    /* Change Understood Cards */
    .tb-understood-panel { border-left: 4px solid var(--green); }
    .tb-summary-text { font-size: 14px; margin: 10px 0 16px; color: var(--ink); }
    .tb-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }
    .tb-card-header {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtle);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
    }
    .tb-diff-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 4px; }
    .tb-diff-row .tb-label { color: var(--muted); flex-shrink: 0; }
    .tb-diff-row .tb-val { font-weight: 500; text-align: right; }
    .tb-val-old { color: var(--subtle); text-decoration: line-through; }
    .tb-val-new { color: var(--green-dark); font-weight: 600; }
    .tb-highlight { background: #fef08a; padding: 0 4px; border-radius: 3px; }

    .tb-json-details { margin-top: 10px; font-size: 12px; }
    .tb-json-details summary { cursor: pointer; color: var(--green); font-weight: 600; }
    .tb-json-block {
      background: #0f172a;
      color: #38bdf8;
      padding: 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-x: auto;
      margin-top: 8px;
    }

    /* Executive Summary Banner */
    .tb-executive-banner {
      background: var(--white);
      border: 1.5px solid var(--line-dark);
      border-radius: var(--radius);
      padding: 18px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .tb-impact-headline { font-size: 26px; color: var(--ink); letter-spacing: -0.6px; margin: 4px 0 0; }
    .tb-filter-chip {
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tb-filter-chip:hover { background: var(--white); border-color: var(--subtle); }
    .tb-filter-chip.active { background: var(--ink); color: var(--white); border-color: var(--ink); }

    /* Plan -> Reality Matrix Table */
    .tb-table-responsive { overflow-x: auto; margin-top: 12px; }
    .tb-matrix-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tb-matrix-table th {
      text-align: left;
      padding: 10px 14px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--line);
    }
    .tb-matrix-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .tb-matrix-table tr:hover td { background: #f8fafc; }
    .tb-row-must td { background: #fff8f8; }
    .tb-row-review td { background: #fffcf0; }
    .tb-delta-sub { font-size: 11px; color: var(--subtle); margin-top: 2px; }

    /* Dependency Graph SVG & Clean Swimlanes */
    .tb-graph-wrapper {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 12px;
      margin-top: 14px;
      overflow-x: auto;
      text-align: center;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
    }
    .tb-graph-svg { max-width: 100%; height: auto; min-width: 820px; }
    
    /* Legend */
    .tb-graph-legend {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 11.5px;
    }
    .tb-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--subtle);
      font-weight: 500;
    }
    .tb-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .tb-dot-must { background: #dc2626; }
    .tb-dot-review { background: #d97706; }
    .tb-dot-no { background: #16a34a; }

    /* Department Swimlanes */
    .tb-lane-bg {
      fill: #f8fafc;
      stroke: #e2e8f0;
      stroke-width: 1px;
      stroke-dasharray: 4,4;
    }
    .tb-lane-title {
      font-size: 9.5px;
      font-weight: 700;
      fill: #64748b;
      letter-spacing: 0.6px;
    }
    .tb-lane-bg-gate {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 1.2px;
      stroke-dasharray: 3,3;
    }
    .tb-lane-title-gate {
      font-size: 9.5px;
      font-weight: 700;
      fill: #475569;
      letter-spacing: 0.8px;
    }

    /* Node Cards */
    .tb-graph-node {
      cursor: pointer;
    }
    .tb-node-rect {
      fill: #ffffff;
      stroke: var(--line-dark);
      stroke-width: 1.2px;
      transition: stroke 0.15s ease, stroke-width 0.15s ease, fill 0.15s ease, filter 0.15s ease;
    }
    .tb-graph-node:hover .tb-node-rect {
      stroke-width: 2.2px !important;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.16)) !important;
    }
    .tb-node-stripe {
      pointer-events: none;
    }
    .tb-node-team {
      font-size: 8px;
      font-weight: 700;
      fill: #64748b;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    .tb-node-tag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    .tb-node-title {
      font-size: 11px;
      font-weight: 700;
      fill: #0f172a;
      pointer-events: none;
    }
    .tb-node-subtitle {
      font-size: 9.5px;
      font-weight: 500;
      fill: #64748b;
      pointer-events: none;
    }

    /* Node Archetypes */
    .tb-node-root .tb-node-rect { fill: #0f172a; stroke: #0f172a; }
    .tb-node-root .tb-node-stripe { fill: #6366f1; }

    .tb-node-filter .tb-node-rect { fill: #f8fafc; stroke: #cbd5e1; }
    .tb-node-filter .tb-node-stripe { fill: #475569; }
    .tb-node-filter .tb-node-title { fill: #1e293b; }
    .tb-node-filter .tb-node-subtitle { fill: #64748b; }
    .tb-node-filter .tb-node-tag { fill: #475569; }

    .tb-node-must .tb-node-rect { fill: #fff8f8; stroke: #fca5a5; }
    .tb-node-must .tb-node-stripe { fill: #dc2626; }
    .tb-node-must .tb-node-tag { fill: #dc2626; }
    .tb-node-must .tb-node-title { fill: #991b1b; }
    .tb-node-must .tb-node-subtitle { fill: #b91c1c; }

    .tb-node-review .tb-node-rect { fill: #fffdf5; stroke: #fcd34d; }
    .tb-node-review .tb-node-stripe { fill: #d97706; }
    .tb-node-review .tb-node-tag { fill: #d97706; }
    .tb-node-review .tb-node-title { fill: #92400e; }
    .tb-node-review .tb-node-subtitle { fill: #b45309; }

    .tb-node-no .tb-node-rect { fill: #f7fef9; stroke: #86efac; }
    .tb-node-no .tb-node-stripe { fill: #16a34a; }
    .tb-node-no .tb-node-tag { fill: #15803d; }
    .tb-node-no .tb-node-title { fill: #166534; }
    .tb-node-no .tb-node-subtitle { fill: #15803d; }
    .tb-node-no .tb-node-tag { fill: #15803d; }

    /* Edge Styling */
    .tb-edge {
      stroke: #94a3b8;
      stroke-width: 1.5px;
      fill: none;
      transition: stroke 0.2s ease, stroke-width 0.2s ease, opacity 0.2s ease;
    }
    .tb-edge-must { stroke: #f87171; stroke-width: 1.8px; fill: none; }
    .tb-edge-dashed { stroke-dasharray: 4, 4; stroke: #10b981; }

    /* Graph Interactive Blast Radius */
    .tb-graph-node.tb-node-selected .tb-node-rect {
      stroke: #4f46e5 !important;
      stroke-width: 3px !important;
      fill: #eef2ff !important;
      filter: drop-shadow(0 0 10px rgba(79, 70, 229, 0.6)) !important;
    }
    .tb-graph-node.tb-node-upstream .tb-node-rect {
      stroke: #0284c7 !important;
      stroke-width: 2.5px !important;
      fill: #e0f2fe !important;
      filter: drop-shadow(0 0 8px rgba(2, 132, 199, 0.45)) !important;
    }
    .tb-graph-node.tb-node-downstream .tb-node-rect {
      stroke: #dc2626 !important;
      stroke-width: 2.5px !important;
      fill: #fee2e2 !important;
      filter: drop-shadow(0 0 8px rgba(220, 38, 38, 0.45)) !important;
    }
    .tb-graph-node.tb-node-dimmed {
      opacity: 0.18;
      transition: opacity 0.2s ease;
    }
    .tb-edge.tb-edge-active-upstream {
      stroke: #0284c7 !important;
      stroke-width: 2.8px !important;
    }
    .tb-edge.tb-edge-active-downstream {
      stroke: #dc2626 !important;
      stroke-width: 2.8px !important;
    }
    .tb-edge.tb-edge-dimmed {
      opacity: 0.10;
      transition: opacity 0.2s ease;
    }
    .tb-graph-selection-panel {
      margin-top: 14px;
      padding: 14px 18px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Presenter Guided Tour Bar */
    .tb-tour-bar {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: min(880px, calc(100vw - 32px));
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      box-shadow: 0 16px 40px -6px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 20px;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: slideTourUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideTourUp {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .tb-tour-header { display: flex; justify-content: space-between; align-items: center; }
    .tb-tour-step-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: #38bdf8;
      color: #0f172a;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .tb-tour-body { font-size: 14px; line-height: 1.5; color: #e2e8f0; }
    .tb-tour-script {
      background: rgba(255, 255, 255, 0.08);
      border-left: 3px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 4px;
      font-style: italic;
      color: #e2e8f0;
      font-size: 13.5px;
      margin-top: 4px;
    }
    .tb-tour-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

        const impacted = changed && ((audience && a.deps.includes('audience')) || (markets && a.deps.includes('markets')));

          ...a,
          status: impacted ? (must ? 'must' : 'review') : 'no',
          before: content(a.id, old),
          after: content(a.id, c),
          reason: !impacted ? (
            a.id === 'A3' ? 'Audience-only change does not change event semantics; existing version fields support it. Validate instrumentation in integration, not a schema rewrite.' :
            a.id === 'P2' ? 'Audience change supplies no evidence for new product/security claims. Keep this independent prerequisite unchanged.' :
            'No linked field changed in this fixture.'
          ) : (
            a.id === 'A2' ? 'Changing eligibility changes the estimand, cohort mix and feasible sample. Re-evaluate power and interpretation; do not mechanically rewrite the experiment.' :
            a.id === 'E3' ? 'A changed pack invalidates prior readiness for affected work. Publishing it does not train the agents.' :
            a.id === 'G3' ? 'New assignments must follow the new audience and preserve consent, ownership and holdout suppression.' :
            a.id === 'G2' ? 'Check whether the promise and CTA still fit the new audience; revise only where justified.' :
            `This artifact explicitly depends on ${[audience && a.deps.includes('audience') ? 'audience policy' : '', markets && a.deps.includes('markets') ? 'market coverage' : ''].filter(Boolean).join(' and ')}.`
          )
        };
      });

      const localeIds = [...new Set([...old.markets, ...c.markets])];
      const locales = localeIds.map(id => {
        const removedMarket = !c.markets.includes(id);
        const addedMarket = !old.markets.includes(id);
        return {
          ...MARKETS.find(m => m.id === id),
          status: !changed ? 'no' : removedMarket ? 'retire' : addedMarket ? 'new' : 'review',
          reason: !changed ? 'Existing localized pack unchanged.' :
            removedMarket ? 'Retire active outreach assets; suppress new assignments; preserve historical reporting and existing customer commitments.' :
            'New master scope invalidates local audience references, message fit, script and training readiness. Review local strategy before language QA.'
        };
      });

      return {

        items,
        locales,
        removed,
        added,
        previouslyContactedRemoved: removed.filter(a => a.previously_contacted),
        phase
      };
    }

    function budget(c, impact, rate, hours) {
      if (!impact.changed) return { central: 0, local: 0, training: 0, total: 0, cost: 0, agents: 0 };
      const active = MARKETS.filter(m => c.markets.includes(m.id));
      const central = 10;
      const local = active.length * 2;
      const agents = active.reduce((s, m) => s + m.agents, 0);
      const training = agents * hours;
      const total = central + local + training;
      return { central, local, training, total, cost: total * rate, agents };
    }

      if (!p) return { ready: false, missing: ['Simulate and accept a proposed change first.'] };

      if (!p.config || population(p.config).length === 0) missing.push('Target population is empty; revise or cancel rather than release.');

      for (const [k, v] of Object.entries(p.reviews)) if (!v) missing.push(k + ' review not recorded.');
      for (const m of p.impact.locales) {
        const s = p.marketChecks[m.id];

          if (!s.local) missing.push(m.id + ': local strategy and language QA not confirmed.');

      }
      if (p.phase === 'inflight' && !p.cutover) missing.push('Existing assignments, cohort treatment and cutover require approval.');
      if (!p.prerequisite) missing.push('Product/security/legal prerequisite not marked as simulated confirmation.');
      return { ready: missing.length === 0, missing };
    }

    window.GTM = {
      MARKETS,
      ACCOUNTS,
      BASE,
      ARTIFACTS,
      GTM_MOTIONS,
      getMotion,
      policyText,
      population,
      counts,
      content,
      makeImpact,
      budget,
      readiness,
      same
    };

      if (m.status === 'retire') {
        items.push({
          id: `L-${m.id}`,
          name: `${m.name} Enablement Pack`,
          team: 'Localization',
          owner: `${m.id} Market Lead`,
          category: 'MUST_CHANGE',
          reason: `${m.name} has been removed from launch scope but currently has active rollout content and ${m.agents} assigned agents.`,
          action: 'Retire future distribution and cancel pending enablement while retaining historical evidence and customer audit trail.',
          marketId: m.id,
          agents: m.agents,
          status: m.status
        });
      } else if (m.status === 'new') {
        items.push({
          id: `L-${m.id}`,
          name: `${m.name} Enablement Pack (${m.locale})`,
          team: 'Localization',
          owner: `${m.id} Market Lead`,
          category: 'MUST_CHANGE',
          reason: `${m.name} is newly added to launch scope.`,
          action: 'Create new local enablement pack, conduct language QA, and onboard local agents.',
          marketId: m.id,
          agents: m.agents,
          status: m.status
        });
      }
    }

    // Compute Executive Summary counts (Prompt Section 8)
    const mustChangeCount = items.filter(i => i.category === 'MUST_CHANGE').length;
    const ownerReviewCount = items.filter(i => i.category === 'OWNER_REVIEW').length;
    const unaffectedCount = items.filter(i => i.category === 'UNAFFECTED').length;
    const totalImpacts = mustChangeCount + ownerReviewCount;

    return {
      rawImpact,
      items,
      summary: {
        totalImpacts,
        mustChangeCount,
        ownerReviewCount,
        unaffectedCount,
        headline: `${totalImpacts} downstream impacts detected`,
        subline: `${mustChangeCount} Must change · ${ownerReviewCount} Need owner review · ${unaffectedCount} Unaffected`
      },
      counts: {
        old: oldCounts,
        new: newCounts,
        removedAccounts: rawImpact.removed.length,
        addedAccounts: rawImpact.added.length
      },
      budget: g.budget(newConfig, rawImpact, 60, 0.5)
    };
  }

  // --- 4. PLAN → REALITY MATRIX (Prompt Section 12) ---
  function computePlanRealityMatrix(oldConfig, newConfig) {
    const oldCounts = g.counts(oldConfig);
    const newCounts = g.counts(newConfig);
    const rawImpact = g.makeImpact(oldConfig, newConfig, 'prelaunch');
    const budget = g.budget(newConfig, rawImpact, 60, 0.5);

    const oldMarketsStr = oldConfig.markets.join(' ');
    const newMarketsStr = newConfig.markets.join(' ');

    const rows = [
      {
        metric: 'Audience Population',
        before: `${oldCounts.eligible} accounts`,
        after: `${newCounts.eligible} accounts`,
        delta: newCounts.eligible < oldCounts.eligible 
          ? `-${oldCounts.eligible - newCounts.eligible} accounts (-${Math.round((1 - newCounts.eligible/oldCounts.eligible)*100)}%)` 
          : 'No change',
        status: newCounts.eligible !== oldCounts.eligible ? 'must' : 'no'
      },
      {
        metric: 'Markets in Scope',
        before: oldMarketsStr,
        after: newMarketsStr,
        delta: oldMarketsStr !== newMarketsStr ? 'Scope modified' : 'Unchanged',
        status: oldMarketsStr !== newMarketsStr ? 'must' : 'no'
      },
      {
        metric: 'France Rollout Status',
        before: oldConfig.markets.includes('FR') ? 'Active' : 'Not in scope',
        after: newConfig.markets.includes('FR') ? 'Active' : 'Retire / Suppress',
        delta: (oldConfig.markets.includes('FR') && !newConfig.markets.includes('FR')) ? 'Retire & suppress' : 'Unchanged',
        status: (oldConfig.markets.includes('FR') && !newConfig.markets.includes('FR')) ? 'must' : 'no'
      },
      {
        metric: 'Experiment Assumptions',
        before: `v1 (${oldCounts.eligible} accounts)`,
        after: newCounts.eligible !== oldCounts.eligible ? 'Review required' : 'v1 valid',
        delta: newCounts.eligible !== oldCounts.eligible ? 'Sample power & strata affected' : 'Unchanged',
        status: newCounts.eligible !== oldCounts.eligible ? 'review' : 'no'
      },
      {
        metric: 'GTM Campaign Manifest',
        before: `v1 (${oldCounts.eligible} accounts)`,
        after: newCounts.eligible !== oldCounts.eligible ? 'Regenerate manifest (v2)' : 'v1 valid',
        delta: newCounts.eligible !== oldCounts.eligible ? `${newCounts.eligible} active / ${rawImpact.removed.length} suppressed` : 'Unchanged',
        status: newCounts.eligible !== oldCounts.eligible ? 'must' : 'no'
      },
      {
        metric: 'Agent Training & Roster',
        before: 'Current (34 agents certified)',
        after: rawImpact.changed ? `Partially stale (${budget.agents} agents affected)` : 'Current',
        delta: rawImpact.changed ? `${budget.training}h retraining required` : 'Unchanged',
        status: rawImpact.changed ? 'must' : 'no'
      },
      {
        metric: 'Programme Readiness Gate',
        before: 'Pending initial checks',
        after: rawImpact.changed ? 'Reopened (Pending demo gates)' : 'Pending',
        delta: rawImpact.changed ? 'All prior sign-offs invalidated' : 'Unchanged',
        status: rawImpact.changed ? 'must' : 'no'
      },
      {
        metric: 'Illustrative Rework Labour',
        before: '0 hours (£0)',
        after: rawImpact.changed ? `${budget.total} hours (£${budget.cost.toLocaleString('en-GB')})` : '0 hours (£0)',
        delta: rawImpact.changed ? `${budget.central}h central + ${budget.local}h local + ${budget.training}h training` : '£0',
        status: rawImpact.changed ? 'review' : 'no'
      }
    ];

    return rows;
  }

  // --- 5. EXPLAINABILITY: "SHOW WHY" CAUSAL GRAPH (Prompt Section 14) ---
  function explainWhy(itemId, analysis) {
    const item = analysis.items.find(i => i.id === itemId);
    if (!item) {
      return {
        id: itemId,
        title: itemId,
        category: 'UNKNOWN',
        chain: ['Unknown artifact ID'],
        rationale: 'No explanation available.'
      };
    }

    let chain = [];
    let rationale = '';

    switch (itemId) {
      case 'L-FR':
        chain = [
          'Master Brief v1 (Initial Mandate includes FR)',
          'Market Scope Decision: Remove France from rollout',
          'France Localized Pack (L-FR) marked for retirement',
          'Suppression gate required for 8 assigned French agents',
          'Historical audit trail preserved, outreach blocked'
        ];
        rationale = 'France was removed from the launch scope in the proposed change. Existing localized assets and queued communications must be retired and suppressed to prevent outreach to French accounts, while maintaining historical audit records.';
        break;

      case 'A1':
        chain = [
          'Natural Language Change Request: Narrow audience',
          'Adoption & Inactivity Boundary Rules Extracted',
          'A1 Audience Definition & Membership Policy v2',
          'Synthetic Account Population Snapshot (96 → 24 accounts)'
        ];
        rationale = 'The proposed change alters core targeting rules by restricting eligibility to accounts with < 20% seat adoption and excluding those inactive for 90+ days. A1 is the single source of truth for audience policy.';
        break;

      case 'A2':
        chain = [
          'A1 Audience Definition Policy v2',
          'Target Population reduced from 96 to 24 accounts',
          'Statistical Power & Minimum Detectable Effect compromised',
          'A2 Measurement Plan Assumptions require owner review'
        ];
        rationale = 'The original measurement plan assumed 96 accounts to achieve statistical power for causal lift. Narrowing to 24 accounts (18 in active markets) substantially alters the sample size, power, and strata. The measurement owner must review assumptions rather than Twin Brain automatically invalidating the test.';
        break;

      case 'A3':
        chain = [
          'Audience Targeting Boundary Filter',
          'Commercial Eligibility Layer',
          'A3 Telemetry Contract (Independent Architecture)'
        ];
        rationale = 'Audience narrowing does not alter event semantics, telemetry payloads, or connection success definitions. The existing telemetry schema already includes programme_version and audience_snapshot_id fields, requiring no schema rewrite.';
        break;

      case 'A4':
        chain = [
          'A1 Audience Definition Snapshot v2',
          'Denominator Change (96 → 24 eligible accounts)',
          'A4 Reporting Specification & Funnel Dashboard'
        ];
        rationale = 'Reporting dashboards must use immutable denominators per version. Overwriting baseline counts would corrupt historical conversion metrics; a v2 funnel view must be created.';
        break;

      case 'G1':
        chain = [
          'A1 Audience Policy (Low adoption only)',
          'Account Needs: Focus on adoption blockers vs general evaluation',
          'G1 Segmentation & Channel Plan'
        ];
        rationale = 'Narrowing audience shifts the commercial conversation from broad exploration to re-engagement and barrier diagnosis. Sales and partner capacity must be rebalanced.';
        break;

      case 'G2':
        chain = [
          'G1 Segmentation Plan',
          'Customer Value Proposition & Email Invitations',
          'G2 Master Messaging & Offer'
        ];
        rationale = 'The draft CTA and value proposition were designed for general business workflows. They need owner review to verify whether the copy effectively addresses low-adoption accounts.';
        break;

      case 'G3':
        chain = [
          'A1 Audience Snapshot v2',
          '72 Accounts Excluded from Outreach Universe',
          'G3 Assignment & Suppression Manifest'
        ];
        rationale = 'The live outreach manifest currently contains 96 accounts. 72 excluded accounts must be actively suppressed to prevent sales outreach to disqualified customers.';
        break;

      case 'E1':
        chain = [
          'G2 Master Messaging & Low-Adoption Discovery',
          'Curriculum Modules for Target Recognition',
          'E1 Training Curriculum'
        ];
        rationale = 'Curriculum must be updated to train customer-facing reps on qualifying low-adoption accounts, uncovering workflow bottlenecks, and handling specific objections.';
        break;

      case 'E2':
        chain = [
          'E1 Training Curriculum',
          'Discovery Questions & QA Rubric',
          'E2 Call Guide & Quality Rubric'
        ];
        rationale = 'Rep scripts and coaching rubrics must reflect the new qualifying criteria. Reps should probe why usage stalled rather than pitching generic features.';
        break;

      case 'E3':
        chain = [
          'E1 Curriculum & E2 Script Updates',
          'Prior Agent Certifications Marked Stale',
          'E3 Agent Readiness Roster'
        ];
        rationale = 'Publishing updated materials does not train reps. Prior certifications are invalidated and reps must be reassessed on v2 materials before outreach can begin.';
        break;

      case 'P1':
        chain = [
          'Programmatic Scope Mutation (v1 → v2)',
          'Invalidation of Central & Local Readiness Sign-offs',
          'P1 Launch & Cutover Gate Reopened'
        ];
        rationale = 'All baseline readiness approvals were granted for v1. Changing audience boundaries and market coverage invalidates prior gates; PM must coordinate re-approval.';
        break;

      case 'P2':
        chain = [
          'Target Audience Selection',
          'Commercial Outreach Scope',
          'P2 Product Claims & Security Contract (Independent Boundary)'
        ];
        rationale = 'Audience narrowing does not alter product architecture, supported environments, encryption, or security claims. Product capability remains an independent prerequisite.';
        break;

      case 'L-US':
      case 'L-UK':
      case 'L-DE':
        chain = [
          'Master Brief v2 Scope Change',
          'Source Copy Updates (G2, E2)',
          `${item.name} (${item.marketId || ''}) Stale Link`,
          'Local Strategy & Language QA Re-verification'
        ];
        rationale = `Master scope changes invalidate the source-version parity of the ${item.name}. Local lead must review the updated discovery questions and retrain assigned agents.`;
        break;

      default:
        chain = [
          'Master Scope Change',
          `Direct dependency on ${item.deps ? item.deps.join(' and ') : 'programme policy'}`,
          item.name
        ];
        rationale = item.reason;
    }

    return {
      id: itemId,
      title: item.name,
      team: item.team,
      owner: item.owner,
      category: item.category,
      chain,
      rationale,
      action: item.action
    };
  }

  // --- 6. DEPENDENCY GRAPH DATA (Prompt Section 13) ---
  function getGraphData(analysis) {
    // Generate clean layered DAG nodes structured into 4 clear enterprise swimlanes
    const nodes = [
      // Level 0: Business Change Trigger (Command Banner)
      { id: 'CHANGE', label: 'BUSINESS CHANGE TRIGGER', subtitle: 'Launch narrowing requested (Audience + FR)', type: 'root', status: 'change', level: 0, x: 490, y: 35, width: 280, height: 46 },

      // Level 1: Scope Mutations
      { id: 'AUDIENCE_NODE', label: 'Audience Filter', subtitle: 'Low adoption only (<20%)', type: 'filter', status: 'must', level: 1, x: 240, y: 100, width: 196, height: 46 },
      { id: 'INACTIVITY_NODE', label: 'Inactivity Rule', subtitle: 'Exclude ≥90d inactive', type: 'filter', status: 'must', level: 1, x: 490, y: 100, width: 196, height: 46 },
      { id: 'MARKET_NODE', label: 'Market Scope', subtitle: 'Remove France (FR)', type: 'filter', status: 'must', level: 1, x: 740, y: 100, width: 196, height: 46 },

      // Lane 1: Analytics & Insights (x = 135)
      { id: 'A1', label: 'A1 Audience Definition', subtitle: '96 ➔ 24 Accounts', team: 'Analytics', status: 'must', level: 2, x: 135, y: 205, width: 196, height: 54 },
      { id: 'A2', label: 'A2 Measurement Plan', subtitle: 'Sample power review', team: 'Analytics', status: 'review', level: 3, x: 135, y: 305, width: 196, height: 54 },
      { id: 'A4', label: 'A4 Reporting Spec', subtitle: 'v2 Funnel dashboard', team: 'Analytics', status: 'must', level: 4, x: 135, y: 405, width: 196, height: 54 },
      
      // Lane 2: GTM Strategy & Messaging (x = 370)
      { id: 'G1', label: 'G1 Segmentation Plan', subtitle: 'Barrier re-engagement', team: 'GTM', status: 'review', level: 2, x: 370, y: 205, width: 196, height: 54 },
      { id: 'G2', label: 'G2 Master Messaging', subtitle: 'Value proposition v2', team: 'GTM', status: 'review', level: 3, x: 370, y: 305, width: 196, height: 54 },
      { id: 'G3', label: 'G3 Campaign Manifest', subtitle: 'Suppress 72 accounts', team: 'GTM', status: 'must', level: 4, x: 370, y: 405, width: 196, height: 54 },

      // Lane 3: Field Enablement (x = 605)
      { id: 'E1', label: 'E1 Training Curriculum', subtitle: 'Target qualification', team: 'Enablement', status: 'must', level: 2, x: 605, y: 205, width: 196, height: 54 },
      { id: 'E2', label: 'E2 Rep Call Guide', subtitle: 'Discovery script update', team: 'Enablement', status: 'review', level: 3, x: 605, y: 305, width: 196, height: 54 },
      { id: 'E3', label: 'E3 Agent Roster', subtitle: '34 Reps stale / reassess', team: 'Enablement', status: 'must', level: 4, x: 605, y: 405, width: 196, height: 54 },

      // Lane 4: Localization & Markets (x = 840)
      { id: 'L-FR', label: 'L-FR France Pack', subtitle: 'Retire & cancel 8 reps', team: 'Localization', status: 'must', level: 2, x: 840, y: 205, width: 196, height: 54 },
      { id: 'L-RETAINED', label: 'Retained Packs', subtitle: 'US / UK / DE alignment', team: 'Localization', status: 'review', level: 3, x: 840, y: 305, width: 196, height: 54 },

      // Level 5: Release Gates & Independent Prerequisite
      { id: 'P1', label: 'P1 Launch Readiness Gate', subtitle: 'Reopened · Approvals invalidated', team: 'Programme', status: 'must', level: 5, x: 440, y: 535, width: 280, height: 54 },
      { id: 'P2', label: 'P2 Product & Safety Contract', subtitle: 'Unaffected prerequisite boundary', team: 'Programme', status: 'no', level: 5, x: 770, y: 535, width: 250, height: 54 }
    ];

    const edges = [
      { from: 'CHANGE', to: 'AUDIENCE_NODE' },
      { from: 'CHANGE', to: 'INACTIVITY_NODE' },
      { from: 'CHANGE', to: 'MARKET_NODE' },

      { from: 'AUDIENCE_NODE', to: 'A1' },
      { from: 'INACTIVITY_NODE', to: 'A1' },
      
      // Column 1 vertical flow
      { from: 'A1', to: 'A2' },
      { from: 'A2', to: 'A4' },
      
      // Cross-column cascade
      { from: 'A1', to: 'G1' },
      { from: 'G1', to: 'G2' },
      { from: 'G2', to: 'G3' },
      
      { from: 'G2', to: 'E1' },
      { from: 'E1', to: 'E2' },
      { from: 'E2', to: 'E3' },

      // Market column flow
      { from: 'MARKET_NODE', to: 'L-FR' },
      { from: 'MARKET_NODE', to: 'L-RETAINED' },
      { from: 'L-RETAINED', to: 'E3' },

      // Convergence into P1 Launch Readiness Gate
      { from: 'A4', to: 'P1' },
      { from: 'G3', to: 'P1' },
      { from: 'E3', to: 'P1' },
      { from: 'L-FR', to: 'P1' },
      { from: 'P2', to: 'P1', dashed: true }
    ];

    return { nodes, edges };
  }

  // Export to window
  global.TWIN_BRAIN = {
    interpretChange,
    mapToConfig,
    analyzeImpact,
    computePlanRealityMatrix,
    explainWhy,
    getProgramContext,
    getGraphData,
    OWNERS,
    DEPENDENCIES
  };

})(typeof window !== 'undefined' ? window : global);

</script>

<script>
// Twin Brain — UI Components & Views
'use strict';

(function(global) {
  const g = global.GTM;
  const tb = global.TWIN_BRAIN;
  if (!g || !tb) {
    console.error('Twin Brain UI requires GTM and TWIN_BRAIN on global window');
    return;
  }

  const esc = x => String(x || '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));

  // Visual helper styles for badges
  const categoryBadge = cat => {
    switch (cat) {
      case 'MUST_CHANGE':
        return '<span class="tb-badge tb-badge-must">🔴 Must change</span>';
      case 'OWNER_REVIEW':
        return '<span class="tb-badge tb-badge-review">🟠 Owner review</span>';

        return '<span class="tb-badge tb-badge-no">🟢 Unaffected</span>';

        return '<span class="tb-badge tb-badge-blocked">⛔ Blocked</span>';
      default:
        return `<span class="tb-badge">${esc(cat)}</span>`;
    }
  };

  // --- 1. HERO NLP INPUT COMPONENT (Prompt Step 1) ---
  function renderHeroNLP(state) {
    const currentInput = state.nlpInput !== undefined 
      ? state.nlpInput 
      : 'We are narrowing the initial launch to low-adoption enterprise customers. Exclude accounts inactive for 90 days and remove France from the first rollout.';

    return `
      <section class="tb-panel tb-hero">
        <div class="tb-hero-header">
          <div class="tb-eyebrow">Step 1 · Natural-Language Change Input</div>
          <h2 class="tb-hero-title">What changed?</h2>
          <p class="tb-muted">
            Describe a proposed business decision or scope shift in natural language. 
            Twin Brain extracts structured intent, validates domain definitions, and deterministically models downstream blast radius.
          </p>
        </div>

        <div class="tb-input-container">
          <textarea id="tbNlpInput" class="tb-textarea" rows="3" placeholder="e.g. We are narrowing the initial launch to low-adoption enterprise customers. Exclude accounts inactive for 90 days and remove France from the first rollout.">${esc(currentInput)}</textarea>
          
          <div class="tb-chips-label">Quick test scenarios:</div>
          <div class="tb-chips">
            <button type="button" class="tb-chip" data-preset="canonical">
              💡 Narrow to low-adoption (&lt;20%), exclude 90d inactive, remove France
            </button>
            <button type="button" class="tb-chip" data-preset="ambiguous">
              ⚠️ Only target low producers (Clarification demo)
            </button>
            <button type="button" class="tb-chip" data-preset="germany">
              🌐 Remove Germany, exclude inactive, &lt;30% adoption
            </button>
            <button type="button" class="tb-chip" data-preset="expand">
              🔄 Expand to all paying business accounts
            </button>
          </div>

          <div class="tb-hero-actions">
            <button type="button" class="tb-btn tb-btn-primary tb-btn-lg" id="tbAnalyzeBtn">
              <span class="tb-ai-sparkle">✨</span> Analyse Change
            </button>
            <span class="tb-pill tb-pill-subtle">Gemini Semantic Change Interpreter v2.5</span>
          </div>
        </div>
      </section>
    `;
  }

  // --- 2. AMBIGUITY CLARIFICATION DIALOG (Prompt Section 4) ---
  function renderAmbiguityAlert(ambiguities) {
    if (!ambiguities || ambiguities.length === 0) return '';

    return `
      <div class="tb-alert tb-alert-amber" id="tbAmbiguityBox">
        <div class="tb-alert-icon">⚠️</div>
        <div class="tb-alert-content">
          <h4>Clarification required before analysis</h4>
          ${ambiguities.map(a => `
            <div class="tb-ambiguity-item">
              <p><strong>${esc(a.issue)}</strong></p>
              <p>Twin Brain suggests the following standard programme definition:</p>
              <div class="tb-definition-quote">
                <code>${esc(a.potential_definition)}</code>
              </div>
            </div>
          `).join('')}
          <div class="tb-row" style="margin-top: 12px; gap: 10px;">
            <button type="button" class="tb-btn tb-btn-amber" id="tbConfirmAmbiguityBtn">
              ✓ Confirm definition &amp; proceed
            </button>
            <button type="button" class="tb-btn" id="tbEditNlpBtn">
              ✏️ Rephrase input
            </button>
          </div>
          <small class="tb-muted" style="display:block; margin-top: 6px;">
            Human-in-the-loop: Twin Brain never guesses ambiguous business metrics without explicit owner confirmation.
          </small>
        </div>
      </div>
    `;
  }

  // --- 3. INTERPRETATION UI ("CHANGE UNDERSTOOD") (Prompt Section 5) ---
  function renderInterpretationUnderstood(state) {
    const p = state.parsedChange;
    if (!p) return '';

    const oldConfig = state.current;
    const newConfig = state.proposedConfig || tb.mapToConfig(p, oldConfig);

    const oldAudienceText = oldConfig.audience === 'all' ? 'All retained paying accounts' : `Low-adoption accounts (<${oldConfig.threshold}%)`;
    const newAudienceText = newConfig.audience === 'all' ? 'All retained paying accounts' : `Low-adoption retained accounts (<${newConfig.threshold}% seats active)`;

    const oldEligibilityText = oldConfig.excludeChurn ? 'Exclude accounts inactive for 90+ days' : 'No inactivity exclusion';
    const newEligibilityText = newConfig.excludeChurn ? 'Exclude accounts inactive for 90+ days' : 'No inactivity exclusion';

    const oldMarketsText = oldConfig.markets.map(m => ({ US: 'US', UK: 'UK', DE: 'Germany', FR: 'France' }[m] || m)).join(' / ');
    const newMarketsText = newConfig.markets.map(m => ({ US: 'US', UK: 'UK', DE: 'Germany', FR: 'France' }[m] || m)).join(' / ');

    return `
      <section class="tb-panel tb-understood-panel">
        <div class="tb-row spread">
          <div>
            <div class="tb-eyebrow">Step 2 · Gemini Interpretation Stage</div>
            <h3 class="tb-panel-title">Change understood</h3>
          </div>
          <span class="tb-pill ${state.interpretationConfirmed ? 'tb-pill-green' : 'tb-pill-amber'}">
            ${state.interpretationConfirmed ? '✓ Confirmed by User' : 'Awaiting Confirmation'}
          </span>
        </div>

        <p class="tb-summary-text">
          <strong>Summary:</strong> ${esc(p.change_summary)}
        </p>

        <div class="tb-grid tb-grid-3">
          <div class="tb-card tb-diff-card">
            <div class="tb-card-header">Audience Target</div>
            <div class="tb-diff-row">
              <span class="tb-label">Current:</span>
              <span class="tb-val tb-val-old">${esc(oldAudienceText)}</span>
            </div>
            <div class="tb-diff-row">
              <span class="tb-label">Proposed:</span>
              <span class="tb-val tb-val-new">${esc(newAudienceText)}</span>
            </div>
          </div>

          <div class="tb-card tb-diff-card">
            <div class="tb-card-header">Eligibility Rules</div>
            <div class="tb-diff-row">
              <span class="tb-label">Current:</span>
              <span class="tb-val tb-val-old">${esc(oldEligibilityText)}</span>
            </div>
            <div class="tb-diff-row">
              <span class="tb-label">Proposed:</span>
              <span class="tb-val tb-val-new">${esc(newEligibilityText)}</span>
            </div>
          </div>

          <div class="tb-card tb-diff-card">
            <div class="tb-card-header">Market Scope</div>
            <div class="tb-diff-row">
              <span class="tb-label">Current:</span>
              <span class="tb-val tb-val-old">${esc(oldMarketsText)}</span>
            </div>
            <div class="tb-diff-row">
              <span class="tb-label">Proposed:</span>
              <span class="tb-val tb-val-new ${oldMarketsText !== newMarketsText ? 'tb-highlight' : ''}">${esc(newMarketsText)}</span>
            </div>
          </div>
        </div>

        <details class="tb-json-details" style="margin-top: 14px;">
          <summary>View Gemini Structured Output JSON (Confidence &amp; Operations)</summary>

          Clean departmental swimlane view mapping upstream strategy decisions down to team deliverables and readiness gates. Click any node to highlight its causal blast radius.
        </p>

        <div class="tb-graph-wrapper">
          <svg viewBox="0 0 980 620" class="tb-graph-svg" id="tbGraphSvg">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
              </marker>
              <marker id="arrow-must" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
              </marker>
              <marker id="arrow-upstream" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
              </marker>
              <marker id="arrow-downstream" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
              </marker>
              <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="125%">
                <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.06" />
              </filter>
            </defs>

            <!-- Departmental Swimlanes (Background) -->
            <g class="tb-graph-lanes">
              <rect x="25" y="155" width="220" height="310" rx="10" class="tb-lane-bg" />
              <text x="135" y="176" text-anchor="middle" class="tb-lane-title">📊 ANALYTICS & INSIGHTS</text>

              <rect x="260" y="155" width="220" height="310" rx="10" class="tb-lane-bg" />
              <text x="370" y="176" text-anchor="middle" class="tb-lane-title">📢 GTM & STRATEGY</text>

              <rect x="495" y="155" width="220" height="310" rx="10" class="tb-lane-bg" />
              <text x="605" y="176" text-anchor="middle" class="tb-lane-title">🎓 FIELD ENABLEMENT</text>

              <rect x="730" y="155" width="220" height="310" rx="10" class="tb-lane-bg" />
              <text x="840" y="176" text-anchor="middle" class="tb-lane-title">🌍 LOCALIZATION SCOPE</text>

              <!-- Gate lane background -->
              <rect x="300" y="495" width="410" height="95" rx="10" class="tb-lane-bg-gate" />
              <text x="505" y="513" text-anchor="middle" class="tb-lane-title-gate">🏁 CROSS-FUNCTIONAL READINESS RELEASE</text>
            </g>

            <!-- Render Smooth Curved Edges -->
            <g class="tb-graph-edges">
              ${edges.map((e, idx) => {
                const src = nodes.find(n => n.id === e.from);
                const tgt = nodes.find(n => n.id === e.to);
                if (!src || !tgt) return '';
                const isMust = tgt.status === 'must';

                const srcH = src.height || 48;
                const tgtH = tgt.height || 48;
                const x1 = src.x;
                const y1 = src.y + srcH / 2;
                const x2 = tgt.x;
                const y2 = tgt.y - tgtH / 2;

                let d = '';
                if (Math.abs(x1 - x2) < 4) {
                  d = `M ${x1} ${y1} L ${x2} ${y2}`;
                } else {
                  const dy = Math.max(y2 - y1, 20);
                  const cp1y = y1 + dy * 0.45;
                  const cp2y = y2 - dy * 0.45;
                  d = `M ${x1} ${y1} C ${x1} ${cp1y}, ${x2} ${cp2y}, ${x2} ${y2}`;
                }

                return `
                  <path d="${d}"
                        class="tb-edge ${e.dashed ? 'tb-edge-dashed' : ''} ${isMust ? 'tb-edge-must' : ''}"
                        data-edge-index="${idx}"
                        marker-end="${isMust ? 'url(#arrow-must)' : 'url(#arrow)'}" />
                `;
              }).join('')}
            </g>

            <!-- Render Rich Card Nodes -->
            <g class="tb-graph-nodes">
              ${nodes.map(n => {
                const isRoot = n.type === 'root';
                const isFilter = n.type === 'filter';
                const isMust = n.status === 'must';
                const isReview = n.status === 'review';
                const isNo = n.status === 'no';
                
                const nodeClass = isRoot ? 'tb-node-root' :
                                  isFilter ? 'tb-node-filter' :
                                  isMust ? 'tb-node-must' :
                                  isReview ? 'tb-node-review' : 'tb-node-no';

                const w = n.width || 196;
                const h = n.height || 54;
                const halfW = w / 2;
                const halfH = h / 2;

                const statusTag = isRoot ? 'TRIGGER' :
                                  isFilter ? 'SCOPE' :
                                  isMust ? 'MUST CHANGE' :
                                  isReview ? 'REVIEW' : 'UNAFFECTED';

                const teamTag = isRoot ? 'BUSINESS INTENT' :
                                isFilter ? 'POLICY FILTER' :
                                (n.team || 'STRATEGY').toUpperCase();

                if (isRoot) {
                  return `
                    <g class="tb-graph-node ${nodeClass}" data-node-id="${n.id}" transform="translate(${n.x}, ${n.y})">
                      <rect x="${-halfW}" y="${-halfH}" width="${w}" height="${h}" rx="8" class="tb-node-rect" filter="url(#nodeShadow)" />
                      <rect x="${-halfW}" y="${-halfH}" width="5" height="${h}" rx="2" class="tb-node-stripe" />
                      <text x="0" y="-7" text-anchor="middle" class="tb-node-title" style="fill:#ffffff; font-size:11.5px; font-weight:700;">⚡ ${esc(n.label)}</text>
                      <text x="0" y="11" text-anchor="middle" class="tb-node-subtitle" style="fill:#94a3b8; font-size:9.5px;">${esc(n.subtitle)}</text>
                    </g>
                  `;
                }

                if (isFilter) {
                  return `
                    <g class="tb-graph-node ${nodeClass}" data-node-id="${n.id}" transform="translate(${n.x}, ${n.y})">
                      <rect x="${-halfW}" y="${-halfH}" width="${w}" height="${h}" rx="8" class="tb-node-rect" filter="url(#nodeShadow)" />
                      <rect x="${-halfW}" y="${-halfH}" width="5" height="${h}" rx="2" class="tb-node-stripe" />
                      <text x="${-halfW + 12}" y="-7" class="tb-node-title" style="font-size:11px; font-weight:700;">${esc(n.label)}</text>
                      <text x="${halfW - 10}" y="-7" text-anchor="end" class="tb-node-tag">${statusTag}</text>
                      <text x="${-halfW + 12}" y="11" class="tb-node-subtitle" style="font-size:9.5px;">${esc(n.subtitle)}</text>
                    </g>
                  `;
                }

                // Standard 3-line Deliverable Card: Line 1 (Team & Tag), Line 2 (Title), Line 3 (Subtitle)
                return `
                  <g class="tb-graph-node ${nodeClass}" data-node-id="${n.id}" transform="translate(${n.x}, ${n.y})">
                    <rect x="${-halfW}" y="${-halfH}" width="${w}" height="${h}" rx="8" class="tb-node-rect" filter="url(#nodeShadow)" />
                    <rect x="${-halfW}" y="${-halfH}" width="5" height="${h}" rx="2" class="tb-node-stripe" />
                    
                    <!-- Line 1: Department Tag (Left) and Status Tag (Right) -->
                    <text x="${-halfW + 12}" y="-12" class="tb-node-team">${esc(teamTag)}</text>
                    <text x="${halfW - 10}" y="-12" text-anchor="end" class="tb-node-tag">${statusTag}</text>
                    
                    <!-- Line 2: Deliverable Title (Dedicated Line, Full Width) -->
                    <text x="${-halfW + 12}" y="4" class="tb-node-title">${esc(n.label)}</text>

                    <text x="${-halfW + 12}" y="18" class="tb-node-subtitle">${esc(n.subtitle || '')}</text>
                  </g>
                `;
              }).join('')}
            </g>
          </svg>
        </div>

        <div id="tbGraphSelection" class="tb-graph-selection-panel" style="display:none;"></div>
      </section>
    `;
  }

</script>

  <!-- 3. APPLICATION STATE & CONTROLLER -->
  <script>
    'use strict';
    const esc = x => String(x || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch] || ch));
    const g = window.GTM;
    const tb = window.TWIN_BRAIN;
    const tui = window.TWIN_BRAIN_UI;

    let appState = {
      tab: 'motion',
      selectedMotion: 'hybrid_sales_assist',
      current: JSON.parse(JSON.stringify(g.BASE)),
      version: 1,
      nlpInput: 'We are narrowing the initial launch to low-adoption enterprise customers. Exclude accounts inactive for 90 days and remove France from the first rollout.',
      parsedChange: null,
      interpretationConfirmed: false,
      proposedConfig: null,
      impactAnalysis: null,
      filter: 'all',
      workstreamFilter: 'all',
      proposal: null,
      selectedGraphNodeId: null,
      tourActive: false,
      tourStep: 0,
      history: [
        { version: 1, type: 'Baseline Charter', note: 'All existing paying accounts across US, UK, DE, FR.', config: JSON.parse(JSON.stringify(g.BASE)) }
      ],
      geminiApiKey: typeof localStorage !== 'undefined' ? (localStorage.getItem('tb_gemini_api_key') || '') : ''
    };

    function init() {
      // Auto-analyze canonical proposal for initial render
      executeAnalysis(appState.nlpInput, false);
      bindGlobalEvents();
      renderApp();
    }

    function executeAnalysis(promptText, autoConfirm) {
      appState.nlpInput = promptText;
      const parsed = tb.interpretChange(promptText);
      appState.parsedChange = parsed;
      appState.interpretationConfirmed = false;
      appState.proposedConfig = tb.mapToConfig(parsed, appState.current);

      if (autoConfirm || parsed.ambiguities.length === 0) {
        confirmAndCalculateImpact();
      } else {
        appState.impactAnalysis = null;
      }
    }

    function confirmAndCalculateImpact() {
      appState.interpretationConfirmed = true;
      appState.impactAnalysis = tb.analyzeImpact(appState.current, appState.proposedConfig, appState.parsedChange?.phase || 'prelaunch');
      
      // Update proposal structure for readiness tab
      appState.proposal = {
        version: appState.version + 1,
        config: JSON.parse(JSON.stringify(appState.proposedConfig)),
        phase: appState.parsedChange?.phase || 'prelaunch',
        impact: appState.impactAnalysis.rawImpact,
        accepted: false,
        reviews: { Analytics: false, GTM: false, Enablement: false },
        marketChecks: Object.fromEntries(appState.impactAnalysis.rawImpact.locales.map(m => [m.id, { local: false, trained: false, retired: false }])),
        cutover: false,
        prerequisite: false
      };
    }

    // --- GRAPH BLAST RADIUS & CAUSAL HIGHLIGHTING ---
    function highlightNodeBlastRadius(nodeId) {
      appState.selectedGraphNodeId = nodeId;
      const graphData = tb.getGraphData(appState.impactAnalysis || { rawImpact: { locales: [] } });
      const { nodes, edges } = graphData;

      const selectedNode = nodes.find(n => n.id === nodeId);
      if (!selectedNode) return;

      // Downstream descendants (BFS)
      const downstreamSet = new Set();
      const downstreamEdgeIndices = new Set();
      const dq = [nodeId];
      while (dq.length > 0) {
        const curr = dq.shift();
        edges.forEach((e, idx) => {
          if (e.from === curr) {
            downstreamEdgeIndices.add(idx);
            if (!downstreamSet.has(e.to)) {
              downstreamSet.add(e.to);
              dq.push(e.to);
            }
          }
        });
      }

      // Upstream ancestors (BFS)
      const upstreamSet = new Set();
      const upstreamEdgeIndices = new Set();
      const uq = [nodeId];
      while (uq.length > 0) {
        const curr = uq.shift();
        edges.forEach((e, idx) => {
          if (e.to === curr) {
            upstreamEdgeIndices.add(idx);
            if (!upstreamSet.has(e.from)) {
              upstreamSet.add(e.from);
              uq.push(e.from);
            }
          }
        });
      }

      // Apply SVG classes
      const svg = document.getElementById('tbGraphSvg');
      if (svg) {
        const nodeEls = svg.querySelectorAll('.tb-graph-node');
        nodeEls.forEach(el => {
          const id = el.dataset.nodeId;
          el.classList.remove('tb-node-selected', 'tb-node-upstream', 'tb-node-downstream', 'tb-node-dimmed');
          if (id === nodeId) {
            el.classList.add('tb-node-selected');
          } else if (upstreamSet.has(id)) {
            el.classList.add('tb-node-upstream');
          } else if (downstreamSet.has(id)) {
            el.classList.add('tb-node-downstream');
          } else {
            el.classList.add('tb-node-dimmed');
          }
        });

        const edgeEls = svg.querySelectorAll('.tb-edge');
        edgeEls.forEach((el, idx) => {
          el.classList.remove('tb-edge-active-upstream', 'tb-edge-active-downstream', 'tb-edge-dimmed');
          if (upstreamEdgeIndices.has(idx)) {
            el.classList.add('tb-edge-active-upstream');
          } else if (downstreamEdgeIndices.has(idx)) {
            el.classList.add('tb-edge-active-downstream');
          } else {
            el.classList.add('tb-edge-dimmed');
          }
        });
      }

      // Render Selection Panel
      const panel = document.getElementById('tbGraphSelection');
      if (panel) {
        panel.style.display = 'flex';
        const statusBadge = selectedNode.status === 'must' ? '<span class="tb-badge tb-badge-must">Must change</span>' :
                            selectedNode.status === 'review' ? '<span class="tb-badge tb-badge-review">Owner review</span>' :
                            selectedNode.status === 'no' ? '<span class="tb-badge tb-badge-no">Unaffected</span>' :
                            '<span class="tb-badge">Business Trigger</span>';
        
        panel.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
            ${statusBadge}
            <strong style="font-size:15px;">${esc(selectedNode.label)}</strong>
            <span style="font-size:12px; color:var(--subtle);">Team: <strong>${esc(selectedNode.team || 'Strategy')}</strong></span>
            <div style="display:inline-flex; gap:12px; font-size:12.5px; background:rgba(0,0,0,0.04); padding:4px 10px; border-radius:4px;">
              <span style="color:#0284c7; font-weight:700;">🔵 Upstream Prerequisites: ${upstreamSet.size}</span>
              <span style="color:#dc2626; font-weight:700;">🔴 Downstream Blast Radius: ${downstreamSet.size}</span>
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <button type="button" class="tb-btn tb-btn-sm tb-btn-why" id="tbGraphPanelWhyBtn">🔍 Causal Cascade ("Why?")</button>
            <button type="button" class="tb-btn tb-btn-sm" id="tbGraphPanelResetBtn">✕ Reset</button>
          </div>
        `;
        const whyBtn = document.getElementById('tbGraphPanelWhyBtn');
        if (whyBtn) whyBtn.onclick = () => openWhyModal(selectedNode.id);
        const resetBtn = document.getElementById('tbGraphPanelResetBtn');
        if (resetBtn) resetBtn.onclick = clearGraphSelection;
      }
    }

    function clearGraphSelection() {
      appState.selectedGraphNodeId = null;
      const svg = document.getElementById('tbGraphSvg');
      if (svg) {
        svg.querySelectorAll('.tb-graph-node').forEach(el => {
          el.classList.remove('tb-node-selected', 'tb-node-upstream', 'tb-node-downstream', 'tb-node-dimmed');
        });
        svg.querySelectorAll('.tb-edge').forEach(el => {
          el.classList.remove('tb-edge-active-upstream', 'tb-edge-active-downstream', 'tb-edge-dimmed');
        });
      }
      const panel = document.getElementById('tbGraphSelection');
      if (panel) panel.style.display = 'none';
    }

    // --- HACKATHON GUIDED DEMO TOUR ---
    const TOUR_STEPS = [
      {
        title: 'Step 0: Align on Commercial GTM Motion & Strategic Outcomes',
        script: 'Before evaluating any changes, cross-functional teams must agree on the commercial GTM motion. Here we see our baseline "Sales-Assisted Hybrid" motion, its 4 core operational input pillars, and measurable business guardrails.',
        nextLabel: 'Simulate an Upstream Change',
        setup: () => {
          appState.tab = 'motion';
          renderApp();
          document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'motion'));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },
      {
        title: 'Step 1: AI Change Intelligence & Blast Radius',
        script: 'In enterprise launches, an upstream policy shift usually triggers weeks of forgotten downstream chaos. Here, Gemini extracts structured intent from natural language, tests ambiguity guardrails, and computes the exact 13 downstream impacts across 16 artifacts.',
        nextLabel: 'Step 2: Programme Charter',
        setup: () => {
          appState.tab = 'intelligence';
          appState.nlpInput = 'We are narrowing the initial launch to low-adoption enterprise customers. Exclude accounts inactive for 90 days and remove France from the first rollout.';
          executeAnalysis(appState.nlpInput, false);
          confirmAndCalculateImpact();
          renderApp();
          document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'intelligence'));
          highlightNodeBlastRadius('L-FR');
          const graphEl = document.querySelector('.tb-graph-wrapper');
          if (graphEl) graphEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      },
      {
        title: 'Step 2: Programme Charter & Master Brief',
        script: 'Step 2 codifies the approved baseline into the Master Brief and frozen audience contract. Here we see the active targeting rule, baseline denominators, and our 4-market allocation matrix across US, UK, Germany, and France.',
        nextLabel: 'Step 3: Team Workstreams',
        setup: () => {
          appState.tab = 'charter';
          renderApp();
          document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'charter'));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },
      {
        title: 'Step 3: Connected Workstreams & 12 Deliverables',
        script: 'Step 3 breaks the programme down into 12 living operational artifacts owned by Analytics, GTM, Enablement, and Programme. Upstream policy changes automatically flag which deliverables must be rewritten, reviewed, or left untouched.',
        nextLabel: 'Step 4: Readiness Gates',
        setup: () => {
          appState.tab = 'workstreams';
          renderApp();
          document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'workstreams'));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },
      {
        title: 'Step 4: Governance & Version-Specific Readiness Gates',
        script: 'No change goes live without rigorous release gates. Step 4 enforces PM scope acceptance, cross-functional sign-offs, local market training, and an in-flight cutover gate before version 2 can be activated.',
        nextLabel: 'Step 5: Audit & History',
        setup: () => {
          appState.tab = 'readiness';
          renderApp();
          document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'readiness'));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },
      {
        title: 'Step 5: Immutable Audit History & Data Export',
        script: 'Every scope revision, sign-off, and account population delta is permanently recorded in the audit trail. Teams can export a verified session JSON snapshot or download account CSVs for complete compliance.',
        nextLabel: 'Finish Demo',
        setup: () => {
          appState.tab = 'history';
          renderApp();
          document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'history'));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
    ];

    function startTour() {
      appState.tourActive = true;
      appState.tourStep = 0;
      runTourStep(0);
    }

    function runTourStep(idx) {
      if (idx < 0 || idx >= TOUR_STEPS.length) {
        stopTour();
        return;
      }
      appState.tourStep = idx;
      TOUR_STEPS[idx].setup();
      renderTourBarUI();
    }

    function nextTourStep() {
      if (appState.tourStep < TOUR_STEPS.length - 1) {
        runTourStep(appState.tourStep + 1);
      } else {
        stopTour();
      }
    }

    function prevTourStep() {
      if (appState.tourStep > 0) {
        runTourStep(appState.tourStep - 1);
      }
    }

    function stopTour() {
      appState.tourActive = false;
      const existing = document.getElementById('tbTourBar');
      if (existing) existing.remove();
    }

    function renderTourBarUI() {
      if (typeof document === 'undefined') return;
      let existing = document.getElementById('tbTourBar');
      if (!appState.tourActive) {
        if (existing) existing.remove();
        return;
      }
      const step = TOUR_STEPS[appState.tourStep];
      const barHtml = tui.renderTourBar(appState.tourStep, TOUR_STEPS.length, step);
      if (existing) {
        existing.outerHTML = barHtml;
      } else {
        document.body.insertAdjacentHTML('beforeend', barHtml);
      }
      bindTourEvents();
    }

    function bindTourEvents() {
      const nextBtn = document.getElementById('tbTourNextBtn');
      if (nextBtn) nextBtn.onclick = nextTourStep;
      const prevBtn = document.getElementById('tbTourPrevBtn');
      if (prevBtn) prevBtn.onclick = prevTourStep;
      const stopBtn = document.getElementById('tbTourStopBtn');
      if (stopBtn) stopBtn.onclick = stopTour;
      const exitBtn = document.getElementById('tbTourExitBtn');
      if (exitBtn) exitBtn.onclick = stopTour;
    }

    function renderApp() {
      const container = document.getElementById('appMain');
      switch (appState.tab) {
        case 'motion':
          container.innerHTML = tui.renderGtmMotionTab(appState);
          break;
        case 'intelligence':
          container.innerHTML = renderIntelligenceTab();
          break;
        case 'charter':
          container.innerHTML = renderCharterTab();
          break;
        case 'workstreams':
          container.innerHTML = renderWorkstreamsTab();
          break;
        case 'readiness':
          container.innerHTML = renderReadinessTab();
          break;
        case 'history':
          container.innerHTML = renderHistoryTab();
          break;
      }
      bindTabEvents();
      if (appState.tourActive) {
        renderTourBarUI();
      }
      if (appState.tab === 'intelligence' && appState.selectedGraphNodeId) {
        highlightNodeBlastRadius(appState.selectedGraphNodeId);
      }
    }

    // --- VIEW: 1. CHANGE INTELLIGENCE ---
    function renderIntelligenceTab() {
      let html = '';

      // Step 1: Natural-Language Input
      html += tui.renderHeroNLP(appState);

      // Step 1.5: Ambiguity Alert (if ambiguous terms found)
      if (appState.parsedChange && appState.parsedChange.ambiguities.length > 0 && !appState.interpretationConfirmed) {
        html += tui.renderAmbiguityAlert(appState.parsedChange.ambiguities);
      }

      // Step 2: Interpretation Understood UI
      if (appState.parsedChange) {
        html += tui.renderInterpretationUnderstood(appState);
      }

      // Step 3: Executive Blast Radius & Actionable Impacts (only after confirmation)
      if (appState.interpretationConfirmed && appState.impactAnalysis) {
        html += tui.renderExecutiveSummary(appState.impactAnalysis, appState.filter);
        html += tui.renderPlanRealityMatrix(appState.current, appState.proposedConfig);
        html += tui.renderDependencyGraph(appState.impactAnalysis);
        html += tui.renderImpactCards(appState.impactAnalysis, appState.filter);
      }

      return html;
    }

    // --- VIEW: 2. PROGRAMME CHARTER ---
    function renderCharterTab() {
      const c = appState.current;
      const cnt = g.counts(c);
      const m = (g.GTM_MOTIONS || []).find(opt => opt.id === (appState.selectedMotion || 'hybrid_sales_assist')) || (g.GTM_MOTIONS || [])[0] || { name: 'Sales-Assisted Hybrid', badge: 'Hybrid Motion' };
      const prop = appState.proposedConfig;
      const hasProp = !!(prop && appState.interpretationConfirmed);
      const propCnt = hasProp ? g.counts(prop) : null;

      return `
        <!-- Connected GTM Motion Banner -->
        <div style="background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); color: white; padding: 18px 24px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(6, 78, 59, 0.2);">
          <div class="tb-row spread" style="align-items: flex-start;">
            <div>
              <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #a7f3d0; font-weight: 700; margin-bottom: 4px;">
                Step 2 · Baseline Programme Governance · Aligned with Step 0 GTM Motion
              </div>
              <h2 style="margin: 0; font-size: 22px; color: white;">Programme Charter &amp; Master Brief (v${appState.version})</h2>
              <div style="margin-top: 6px; font-size: 13.5px; color: #d1fae5;">
                Active Commercial Motion: <strong>${esc(m.name)}</strong> (${esc(m.badge || 'Hybrid')}) · Target Persona: <strong>Admin + Business Sponsor</strong>
              </div>
            </div>
            <div class="tb-row" style="gap: 10px;">
              <button type="button" class="tb-btn" data-switch-tab="motion" style="background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3);">
                🚢 View Step 0 Motion
              </button>
              <button type="button" class="tb-btn" data-switch-tab="intelligence" style="background: white; color: #065f46; font-weight: 700;">
                🧠 Propose Change with AI
              </button>
            </div>
          </div>
