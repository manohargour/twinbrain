    // --- EVENT BINDINGS ---
    function bindGlobalEvents() {
      // Tab switching
      document.querySelectorAll('nav button').forEach(btn => {
        btn.onclick = () => {
          appState.tab = btn.dataset.tab;
          document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
          renderApp();
          window.scrollTo(0, 0);
        };
      });

      // Settings button
      const settingsBtn = document.getElementById('tbSettingsBtn');
      if (settingsBtn) {
        settingsBtn.onclick = openSettingsModal;
      }

      // 2-Min Demo Tour button
      const tourBtn = document.getElementById('tbTourBtn');
      if (tourBtn) {
        tourBtn.onclick = startTour;
      }

      // Keyboard arrow keys for tour
      if (typeof window !== 'undefined') {
        window.addEventListener('keydown', (e) => {
          if (appState.tourActive) {
            if (e.key === 'ArrowRight' || e.key === 'Enter') {
              e.preventDefault();
              nextTourStep();
            } else if (e.key === 'ArrowLeft') {
              e.preventDefault();
              prevTourStep();
            } else if (e.key === 'Escape') {
              e.preventDefault();
              stopTour();
            }
          }
        });
      }
    }

    function bindTabEvents() {
      // Tab switcher in content
      document.querySelectorAll('[data-switch-tab]').forEach(btn => {
        btn.onclick = () => {
          const tab = btn.dataset.switchTab;
          document.querySelector(`nav button[data-tab="${tab}"]`).click();
        };
      });

      // Motion selection in Step 0
      document.querySelectorAll('[data-select-motion]').forEach(el => {
        el.onclick = () => {
          appState.selectedMotion = el.dataset.selectMotion;
          renderApp();
        };
      });

      // Workstream category filter in Step 3
      document.querySelectorAll('[data-ws-filter]').forEach(btn => {
        btn.onclick = () => {
          appState.workstreamFilter = btn.dataset.wsFilter;
          renderApp();
        };
      });

      // 1-Click Simulate v2 in Step 4
      const simV2Btn = document.getElementById('tbSimulateV2GateBtn');
      if (simV2Btn) {
        simV2Btn.onclick = () => {
          executeAnalysis('We are narrowing the initial launch to low-adoption enterprise customers. Exclude accounts inactive for 90 days and remove France from the first rollout.', true);
          renderApp();
        };
      }

      // Quick chip clicks
      document.querySelectorAll('.tb-chip').forEach(chip => {
        chip.onclick = () => {
          const textarea = document.getElementById('tbNlpInput');
          switch (chip.dataset.preset) {
            case 'canonical':
              textarea.value = 'We are narrowing the initial launch to low-adoption enterprise customers. Exclude accounts inactive for 90 days and remove France from the first rollout.';
              break;
            case 'ambiguous':
              textarea.value = 'Only target low producers.';
              break;
            case 'germany':
              textarea.value = 'Remove Germany and target accounts with less than 30% adoption. Exclude inactive for 90 days.';
              break;
            case 'expand':
              textarea.value = 'Expand to all paying business accounts across all markets with no inactivity exclusion.';
              break;
          }
          executeAnalysis(textarea.value, false);
          renderApp();
        };
      });

      // Analyze button
      const analyzeBtn = document.getElementById('tbAnalyzeBtn');
      if (analyzeBtn) {
        analyzeBtn.onclick = () => {
          const text = document.getElementById('tbNlpInput').value;
          executeAnalysis(text, false);
          renderApp();
        };
      }

      // Confirm ambiguity button
      const confirmAmbiguityBtn = document.getElementById('tbConfirmAmbiguityBtn');
      if (confirmAmbiguityBtn) {
        confirmAmbiguityBtn.onclick = () => {
          if (appState.parsedChange) {
            appState.parsedChange.confirmedAmbiguities = true;
            appState.proposedConfig = tb.mapToConfig(appState.parsedChange, appState.current);
            confirmAndCalculateImpact();
            renderApp();
          }
        };
      }

      // Confirm interpretation button
      const confirmInterpBtn = document.getElementById('tbConfirmInterpretationBtn');
      if (confirmInterpBtn) {
        confirmInterpBtn.onclick = () => {
          confirmAndCalculateImpact();
          renderApp();
        };
      }

      // Filter chips
      document.querySelectorAll('.tb-filter-chip').forEach(chip => {
        chip.onclick = () => {
          appState.filter = chip.dataset.filter;
          renderApp();
        };
      });

      // "Show why" buttons
      document.querySelectorAll('[data-show-why]').forEach(btn => {
        btn.onclick = () => {
          openWhyModal(btn.dataset.showWhy);
        };
      });

      // Interactive Dependency Graph nodes
      document.querySelectorAll('.tb-graph-node').forEach(node => {
        node.onclick = (e) => {
          e.stopPropagation();
          const nodeId = node.dataset.nodeId;
          if (appState.selectedGraphNodeId === nodeId) {
            openWhyModal(nodeId);
          } else {
            highlightNodeBlastRadius(nodeId);
          }
        };
      });

      // Clear graph selection on SVG background click
      const graphSvg = document.getElementById('tbGraphSvg');
      if (graphSvg) {
        graphSvg.onclick = (e) => {
          if (!e.target.closest('.tb-graph-node')) {
            clearGraphSelection();
          }
        };
      }

      // Readiness buttons
      const acceptProposalBtn = document.getElementById('tbAcceptProposalBtn');
      if (acceptProposalBtn) {
        acceptProposalBtn.onclick = () => {
          if (appState.proposal) {
            appState.proposal.accepted = true;
            renderApp();
          }
        };
      }

      document.querySelectorAll('[data-review-key]').forEach(cb => {
        cb.onchange = () => {
          appState.proposal.reviews[cb.dataset.reviewKey] = cb.checked;
          renderApp();
        };
      });

      document.querySelectorAll('[data-market-id]').forEach(cb => {
        cb.onchange = () => {
          const mid = cb.dataset.marketId;
          const check = cb.dataset.marketCheck;
          appState.proposal.marketChecks[mid][check] = cb.checked;
          if (check === 'local' && !cb.checked) {
            appState.proposal.marketChecks[mid].trained = false;
          }
          renderApp();
        };
      });

      const prereqCheck = document.getElementById('tbPrereqCheck');
      if (prereqCheck) {
        prereqCheck.onchange = () => {
          appState.proposal.prerequisite = prereqCheck.checked;
          renderApp();
        };
      }

      const activateVersionBtn = document.getElementById('tbActivateVersionBtn');
      if (activateVersionBtn) {
        activateVersionBtn.onclick = () => {
          const p = appState.proposal;
          if (!p || !g.readiness(p).ready) return;

          appState.history.push({
            version: p.version,
            type: 'Simulated Activation',
            note: `Activated v${p.version}: ${g.policyText(p.config)}`,
            config: JSON.parse(JSON.stringify(p.config))
          });

          appState.current = JSON.parse(JSON.stringify(p.config));
          appState.version = p.version;
          appState.proposal = null;
          appState.impactAnalysis = null;
          appState.parsedChange = null;
          appState.interpretationConfirmed = false;
          document.querySelector('nav button[data-tab="history"]').click();
        };
      }

      // Export / Download buttons
      const dlJson = document.getElementById('tbDownloadJsonBtn');
      if (dlJson) {
        dlJson.onclick = exportSessionJson;
      }

      const dlAcc = document.getElementById('tbDownloadAccountsBtn');
      if (dlAcc) {
        dlAcc.onclick = exportAccountsCsv;
      }

      const resetBtn = document.getElementById('tbResetBtn');
      if (resetBtn) {
        resetBtn.onclick = () => {
          if (confirm('Reset this simulation session? All unsaved proposals will reset to v1.')) {
            appState.current = JSON.parse(JSON.stringify(g.BASE));
            appState.version = 1;
            appState.proposal = null;
            appState.history = [
              { version: 1, type: 'Baseline Charter', note: 'All existing paying accounts.', config: JSON.parse(JSON.stringify(g.BASE)) }
            ];
            document.querySelector('nav button[data-tab="intelligence"]').click();
          }
        };
      }
    }

    // Modal Helpers
    function openWhyModal(itemId) {
      if (!appState.impactAnalysis) return;
      const modalCont = document.getElementById('modalContainer');
      modalCont.innerHTML = tui.renderExplainWhyModal(itemId, appState.impactAnalysis);

      document.getElementById('tbCloseWhyModal').onclick = closeWhyModal;
      document.getElementById('tbCloseWhyModalBtn').onclick = closeWhyModal;
      document.getElementById('tbWhyModalBackdrop').onclick = (e) => {
        if (e.target.id === 'tbWhyModalBackdrop') closeWhyModal();
      };
    }

    function closeWhyModal() {
      document.getElementById('modalContainer').innerHTML = '';
    }

    function openSettingsModal() {
      const modalCont = document.getElementById('modalContainer');
      modalCont.innerHTML = `
        <div class="tb-modal-backdrop" id="tbSettingsModalBackdrop">
          <div class="tb-modal">
            <div class="tb-modal-header tb-row spread">
              <h3>⚡ Gemini AI Engine Settings</h3>
              <button type="button" class="tb-btn-close" id="tbCloseSettingsModal">&times;</button>
            </div>
            <div class="tb-modal-body">
              <p>Twin Brain operates in dual mode:</p>
              <ul>
                <li><strong>Local Semantic Engine (Default):</strong> High-fidelity, deterministic NLP parser with domain ontology. Works 100% offline with 0ms latency.</li>
                <li><strong>Google Gemini Live API:</strong> Connect directly to Gemini 2.0 / 1.5 for dynamic free-form synthesis and open-ended change interpretation.</li>
              </ul>
              <div style="margin: 16px 0;">
                <label style="font-weight: 600; display:block; margin-bottom: 6px;">Google Gemini API Key (Optional):</label>
                <input type="password" id="tbGeminiApiKeyInput" class="tb-textarea" style="height: 40px; padding: 8px 12px;" placeholder="AIzaSy..." value="${esc(appState.geminiApiKey)}">
                <small class="tb-muted">Stored locally in your browser session. Never sent to any third party.</small>
              </div>
            </div>
            <div class="tb-modal-footer tb-row" style="justify-content: flex-end; gap: 8px;">
              <button type="button" class="tb-btn" id="tbClearKeyBtn">Clear Key</button>
              <button type="button" class="tb-btn tb-btn-primary" id="tbSaveKeyBtn">Save Settings</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('tbCloseSettingsModal').onclick = () => modalCont.innerHTML = '';
      document.getElementById('tbClearKeyBtn').onclick = () => {
        localStorage.removeItem('tb_gemini_api_key');
        appState.geminiApiKey = '';
        modalCont.innerHTML = '';
      };
      document.getElementById('tbSaveKeyBtn').onclick = () => {
        const key = document.getElementById('tbGeminiApiKeyInput').value.trim();
        localStorage.setItem('tb_gemini_api_key', key);
        appState.geminiApiKey = key;
        modalCont.innerHTML = '';
      };
    }

    function downloadFile(filename, text, mimeType) {
      const blob = new Blob([text], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportSessionJson() {
      const payload = {
        product: 'Twin Brain — Organisational Change Intelligence',
        version: appState.version,
        current_scope: appState.current,
        history: appState.history,
        context: tb.getProgramContext(appState.current, appState.version),
        timestamp: new Date().toISOString()
      };
      downloadFile(`twin-brain-session-v${appState.version}.json`, JSON.stringify(payload, null, 2), 'application/json');
    }

    function exportAccountsCsv() {
      const keys = Object.keys(g.ACCOUNTS[0]);
      const csv = keys.join(',') + '\n' + g.ACCOUNTS.map(a => keys.map(k => a[k]).join(',')).join('\n');
      downloadFile('synthetic-business-accounts.csv', csv, 'text/csv');
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
